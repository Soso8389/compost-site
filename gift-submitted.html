<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

<body>
<div class="page">
  <div class="card">
    <div class="icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>

    <h1>Claim submitted.</h1>
    <p>We got your photo. If it looks good we will add a point to your account and be in touch about your gift card.</p>
