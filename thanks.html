<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanks — CVHS Can Compost</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .thanks-wrap {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: calc(var(--marquee-h) + 80px) 24px 80px;
      text-align: center;
    }
    .thanks-card {
      background: var(--cream); border: 1px solid var(--tan-soft);
      border-radius: 24px; padding: 56px 40px; max-width: 480px; width: 100%;
    }
    .thanks-card .check {
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--leaf-soft); color: var(--green);
      display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;
    }
    .thanks-card h1 { font-size: 2rem; margin-bottom: 12px; }
    .thanks-card p { color: var(--muted); margin-bottom: 28px; }
  </style>
</head>
<body>

<div class="marquee" aria-hidden="true">
  <div class="marquee-track">
    <span>Thank you for volunteering</span>
    <span>Every shift makes a difference</span>
    <span>CVHS Can Compost</span>
    <span>Thank you for volunteering</span>
    <span>Every shift makes a difference</span>
    <span>CVHS Can Compost</span>
  </div>
</div>

<div class="thanks-wrap">
  <div class="thanks-card">
    <div class="check">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>You're signed up.</h1>
    <p>Thanks for volunteering. We will be in touch with your shift details. See you at the station.</p>
    <a href="index.html" class="btn btn-primary">Back to the site</a>
  </div>
</div>

</body>
</html>
